[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-overview"
version = "0.1.0"
description = "Turn a document into a two-host podcast MP3 on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Kaung Myat Naing" }]
keywords = ["podcast", "tts", "local", "cli"]
dependencies = [
    "numpy>=1.26",
    "pydub>=0.25.1",
    "pypdf>=5.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
audio-overview = "audio_overview.cli:main"

[project.urls]
Source = "https://github.com/KaungMyatNaing9/audio-overview"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_overview = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["audio_overview", "tests"]
